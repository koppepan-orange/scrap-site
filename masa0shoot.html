<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゼロ摩擦サッカー madebyClaude</title>
<style>
:root{color-scheme:dark;--bg:#0f1318;--fg:#e8edf2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
#reset{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px));background:#2b323b;color:var(--fg);border:1px solid #4a5563;border-radius:8px;padding:6px 12px;font-size:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="reset">リセット (R)</button>
<script>
// ===== 設定 =====
const W = 480, H = 800, GW = 170, GD = 60;
const PR = 16, BR = 11, ARM = 40;
const F_WALL = 0.75, F_BALL = 1.0, F_MAN = 0.5;
const REST_WALL = 0.92, VMAX = 26;
// ===== 行動規範 =====
const ROLES = [
  {k: 'ego',   name: 'エゴイスト',   e: '😈'},
  {k: 'pass',  name: '受け身',       e: '🥺'},
  {k: 'mid',   name: '中間管理職',   e: '👔'},
  {k: 'off',   name: 'オフェンス',   e: '💥'},
  {k: 'weird', name: 'へんな人',     e: '🤪'},
  {k: 'guard', name: '防人',         e: '🛡️'}
];
const RM = Object.fromEntries(ROLES.map(r => [r.k, r]));

const T = 40, gx1 = (W - GW) / 2, gx2 = (W + GW) / 2;
const walls = [
  [-T, -GD - T, 0, H + GD + T], [W, -GD - T, W + T, H + GD + T],
  [0, -GD - T, gx1, 0], [gx2, -GD - T, W, 0], [gx1, -GD - T, gx2, -GD],
  [0, H, gx1, H + GD + T], [gx2, H, W, H + GD + T], [gx1, H + GD, gx2, H + GD + T]
];

class Ob {
  constructor(x, y, r, m) {
    this.x = x; this.y = y; this.r = r; this.m = m;
    this.vx = 0; this.vy = 0; this.ax = 0; this.ay = 0;
    this.masa = 1; // 摩擦。1 = ゼロ摩擦
  }
  push(x, y) { this.ax += x; this.ay += y; }
  calc() {
    this.vx += this.ax; this.vy += this.ay;
    this.vx *= this.masa; this.vy *= this.masa;
    const s = Math.hypot(this.vx, this.vy);
    if (s > VMAX) { this.vx *= VMAX / s; this.vy *= VMAX / s; }
    this.ax = 0; this.ay = 0;
  }
  mv(f) { this.x += this.vx * f; this.y += this.vy * f; }
}

function hitWalls(o, e) {
  for (const [x1, y1, x2, y2] of walls) {
    const cx = Math.max(x1, Math.min(o.x, x2)), cy = Math.max(y1, Math.min(o.y, y2));
    let dx = o.x - cx, dy = o.y - cy, d = Math.hypot(dx, dy);
    if (d >= o.r) continue;
    let nx, ny;
    if (d === 0) {
      const l = o.x - x1, r = x2 - o.x, t = o.y - y1, b = y2 - o.y, mn = Math.min(l, r, t, b);
      if (mn === l) { nx = -1; ny = 0; } else if (mn === r) { nx = 1; ny = 0; }
      else if (mn === t) { nx = 0; ny = -1; } else { nx = 0; ny = 1; }
      o.x += nx * (mn + o.r); o.y += ny * (mn + o.r);
    } else {
      nx = dx / d; ny = dy / d;
      o.x += nx * (o.r - d); o.y += ny * (o.r - d);
    }
    const vn = o.vx * nx + o.vy * ny;
    if (vn < 0) {
      o.vx -= (1 + e) * vn * nx; o.vy -= (1 + e) * vn * ny;
      if (vn < -3) impact(o, -vn, o.x - nx * o.r, o.y - ny * o.r, nx, ny);
    }
  }
}
function burst(x, y, n, spd, hue, dirx = 0, diry = 0, spread = Math.PI * 2) {
  const base = Math.atan2(diry, dirx), dird = dirx || diry;
  for (let i = 0; i < n; i++) {
    const a = dird ? base + (Math.random() - 0.5) * spread : Math.random() * Math.PI * 2;
    const s = spd * (0.3 + Math.random() * 0.9);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, dec: 0.02 + Math.random() * 0.03, hue: hue + Math.random() * 40 - 20, sz: 1.5 + Math.random() * 3 });
  }
  if (parts.length > 900) parts.splice(0, parts.length - 900);
}
function impact(o, v, px, py, nx, ny) {
  burst(px, py, Math.min(10, (3 + v) | 0), v * 0.6, o === ball ? 50 : 200, nx, ny, 1.6);
  shake = Math.max(shake, Math.min(6, v * 0.25));
}
function drawTrail(t, hue, w) {
  for (let i = 1; i < t.length; i++) {
    const k = i / t.length;
    ctx.strokeStyle = `hsla(${hue},100%,60%,${k * 0.45})`; ctx.lineWidth = w * k;
    ctx.beginPath(); ctx.moveTo(t[i - 1].x, t[i - 1].y); ctx.lineTo(t[i].x, t[i].y); ctx.stroke();
  }
}
function inWall(px, py) {
  return walls.some(([x1, y1, x2, y2]) => px > x1 && px < x2 && py > y1 && py < y2);
}
function hitCirc(a, b, e) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
  if (d >= min || d === 0) return;
  const nx = dx / d, ny = dy / d, ov = min - d, tm = a.m + b.m;
  a.x -= nx * ov * b.m / tm; a.y -= ny * ov * b.m / tm;
  b.x += nx * ov * a.m / tm; b.y += ny * ov * a.m / tm;
  const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (rv < 0) {
    const j = -(1 + e) * rv / (1 / a.m + 1 / b.m);
    a.vx -= j * nx / a.m; a.vy -= j * ny / a.m;
    b.vx += j * nx / b.m; b.vy += j * ny / b.m;
  }
}
function collide(a, b, e, hue) {
  if (Math.hypot(b.x - a.x, b.y - a.y) < a.r + b.r) {
    const rs = Math.hypot(a.vx - b.vx, a.vy - b.vy);
    if (rs > 5) { burst((a.x + b.x) / 2, (a.y + b.y) / 2, Math.min(10, rs | 0), rs * 0.45, hue); shake = Math.max(shake, Math.min(8, rs * 0.3)); }
  }
  hitCirc(a, b, e);
}

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let agents = [], ball, me, mouse = { x: W / 2, y: H / 2 }, tick = 0;
let score = { me: 0, foe: 0 }, flash = 0, flashText = '', parts = [], trailBall = [], shake = 0, goalHue = 0, lineup = ['', ''];

function mk(team, i) {
  const xs = [100, 40, 380, 440];
  const a = new Ob(xs[i], team === 0 ? H - PR - 2 : PR + 2, PR, 1);   // 自陣ゴール側の壁際スタート
  const human = team === 0 && i === 0;
  Object.assign(a, { team, human, ang: 0, hit: false, tip: {}, trail: [], ph: Math.random() * 6.28, side: Math.random() < 0.5 ? -1 : 1,
    role: human ? 'human' : ROLES[(Math.random() * ROLES.length) | 0].k });
  return a;
}
function reset() {
  agents = [];
  for (let t = 0; t < 2; t++) for (let i = 0; i < 4; i++) agents.push(mk(t, i));
  me = agents[0];
  ball = new Ob(W / 2, H / 2, BR, 0.6);
  trailBall = [];
  const names = t => agents.filter(a => a.team === t && !a.human).map(a => RM[a.role].e + RM[a.role].name).join(' ');
  lineup = ['味方: ' + names(0), '敵: ' + names(1)];
}
reset();

// 手の先に何があるか
function probe(a, ang) {
  const tx = a.x + Math.cos(ang) * ARM, ty = a.y + Math.sin(ang) * ARM;
  if (inWall(tx, ty)) return { k: 'wall', tx, ty };
  if (Math.hypot(ball.x - tx, ball.y - ty) < ball.r + 4) return { k: 'ball', tx, ty };
  if (a.role !== 'pass') for (const o of agents) if (o !== a && Math.hypot(o.x - tx, o.y - ty) < o.r + 3) return { k: 'man', o, tx, ty };
  return { k: null, tx, ty };
}

// CPU: 行動規範 → 目標地点 → 反作用でそっちへ行ける手の向きを選ぶ
function think(a) {
  const own = a.team === 0 ? H : 0, foe = H - own;
  let tx = ball.x + ball.vx * 6, ty = ball.y + ball.vy * 6;
  switch(a.role){
    case "mid":{
        tx = W / 2 + (ball.x - W / 2) * 0.42; 
        ty = own + (ball.y - own) * 0.42;
        break;
    }
    case "off":{
        let bd = 1e9, b = null;
        for(const o of agents){
            if(o.team !== a.team){
                const d = Math.hypot(o.x - a.x, o.y - a.y); 
                if(d < bd) bd = d, b = o;
            }
        }
        tx = b.x + b.vx * 4;
        ty = b.y + b.vy * 4;
        break;
    }

    case "weird":{
        tx = W / 2 + a.side * (GW / 2 + 50) + Math.sin(tick * 0.03 + a.ph) * 30;
        ty = foe + (foe === 0 ? 80 : -80) + Math.sin(tick * 0.02 + a.ph) * 40;
        break;
    }

    case "guard":{
        tx = W/2 + Math.sin(tick * 0.03 + a.ph) * GW * 0.4;
        ty = own + (own == 0 ? 70 : -70);
        if(Math.hypot(ball.x - W / 2, ball.y - own) < 160) tx = ball.x, ty = ball.y;
    }
  }

  let ux = (tx - a.x) * 0.012 - a.vx * 0.45, uy = (ty - a.y) * 0.012 - a.vy * 0.45;
  const ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;
  let gx = W / 2 - ball.x, gy = foe - ball.y; const gl = Math.hypot(gx, gy) || 1; gx /= gl; gy /= gl;
  let best = 0.15, bang = Math.atan2(-uy, -ux);   // 何にも触れないなら、進みたい方向の逆に構えておく
  for (let i = 0; i < 24; i++) {
    const ang = i * Math.PI / 12, dx = Math.cos(ang), dy = Math.sin(ang), p = probe(a, ang);
    if (!p.k) continue;
    let sc = -(dx * ux + dy * uy);
    if (p.k === 'ball') { if (a.role === 'off') continue; sc = sc * 0.4 + 0.9 * (dx * gx + dy * gy); }
    else if (p.k === 'man') sc += (a.role === 'ego' || a.role === 'off') ? 0.25 : 0;
    if (sc > best) { best = sc; bang = ang; }
  }
  a.ang = bang;
}

function step() {
  tick++;
  for (const a of agents) {
    if (a.human) a.ang = Math.atan2(mouse.y - a.y, mouse.x - a.x);
    else if ((tick + agents.indexOf(a)) % 2 === 0) think(a);
    const dx = Math.cos(a.ang), dy = Math.sin(a.ang), p = probe(a, a.ang);
    a.tip = p; a.hit = !!p.k;
    if (p.k === 'wall') { a.push(-dx * F_WALL, -dy * F_WALL); burst(p.tx, p.ty, 2, 7, 20, -dx, -dy, 1.2); }
    else if (p.k === 'ball') { ball.push(dx * F_BALL, dy * F_BALL); a.push(-dx * F_BALL * 0.5, -dy * F_BALL * 0.5); burst(p.tx, p.ty, 6, 10, 50, dx, dy, 1.2); shake = Math.max(shake, 2); }
    else if (p.k === 'man') { p.o.push(dx * F_MAN, dy * F_MAN); a.push(-dx * F_MAN, -dy * F_MAN); burst(p.tx, p.ty, 4, 8, 330, dx, dy, 1.2); }
  }
  for (const a of agents) a.calc();
  ball.calc();
  const SUB = 3;
  for (let s = 0; s < SUB; s++) {
    for (const a of agents) { a.mv(1 / SUB); hitWalls(a, REST_WALL); }
    ball.mv(1 / SUB); hitWalls(ball, REST_WALL);
    for (let i = 0; i < agents.length; i++) {
      for (let j = i + 1; j < agents.length; j++) hitCirc(agents[i], agents[j], 0.85);
      collide(agents[i], ball, 0.9, 190);
    }
    for (const a of agents) hitWalls(a, REST_WALL);
    hitWalls(ball, REST_WALL);
  }
  const gTop = ball.y + ball.r < 0, gBot = ball.y - ball.r > H;
  if (gTop || gBot) {
    if (gTop) { score.me++; flashText = 'ゴール！'; } else { score.foe++; flashText = '失点…'; }
    goalHue = Math.random() * 360; flash = 70; shake = 22;
    const gy = gTop ? 0 : H;
    burst(ball.x, gy, 140, 16, goalHue); burst(ball.x, gy, 90, 9, goalHue + 120); burst(ball.x, gy, 50, 5, 50);
    reset();
  }
  if (flash > 0) flash--;
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life -= p.dec; }
  parts = parts.filter(p => p.life > 0);
  for (const a of agents) { a.trail.push({ x: a.x, y: a.y }); if (a.trail.length > (a.human ? 16 : 8)) a.trail.shift(); }
  trailBall.push({ x: ball.x, y: ball.y }); if (trailBall.length > 22) trailBall.shift();
  shake *= 0.88;
}

let vs = 1, ox = 0, oy = 0;
function layout() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  vs = Math.min(cv.width / (W + 60), cv.height / (H + 2 * GD + 100));
  ox = (cv.width - W * vs) / 2; oy = (cv.height - (H + 2 * GD) * vs) / 2 + GD * vs;
}
addEventListener('resize', layout); layout();
function setMouse(e) {
  const r = cv.getBoundingClientRect(), dpr = cv.width / r.width;
  mouse.x = ((e.clientX - r.left) * dpr - ox) / vs;
  mouse.y = ((e.clientY - r.top) * dpr - oy) / vs;
}
addEventListener('pointermove', setMouse);
addEventListener('pointerdown', setMouse);
addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') reset(); });
document.getElementById('reset').addEventListener('pointerdown', e => { e.stopPropagation(); reset(); });

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0f1318'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(vs, 0, 0, vs, ox + (Math.random() - 0.5) * shake * vs, oy + (Math.random() - 0.5) * shake * vs);
  ctx.fillStyle = '#1d2a22'; ctx.fillRect(gx1, -GD, GW, GD); ctx.fillRect(gx1, H, GW, GD);
  ctx.fillStyle = '#17331f'; ctx.fillRect(0, 0, W, H);
  if (flash > 0) { ctx.fillStyle = `hsla(${goalHue},100%,60%,${flash / 70 * 0.35})`; ctx.fillRect(0, 0, W, H); }
  ctx.strokeStyle = '#3f7a52'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 60, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#2b323b';
  for (const [x1, y1, x2, y2] of walls) ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#4aa3ff'; ctx.beginPath(); ctx.moveTo(gx1, H); ctx.lineTo(gx2, H); ctx.stroke();   // 自陣
  ctx.strokeStyle = '#ff5d6c'; ctx.beginPath(); ctx.moveTo(gx1, 0); ctx.lineTo(gx2, 0); ctx.stroke();   // 敵陣
  ctx.lineCap = 'round';
  drawTrail(trailBall, 50, 9);
  for (const a of agents) drawTrail(a.trail, a.team === 0 ? 190 : 350, a.human ? 12 : 8);
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 18;
  ctx.fillStyle = '#f4f4f4'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  for (const a of agents) {
    const col = a.human ? '#4aa3ff' : a.team === 0 ? '#37d6b5' : '#ff5d6c';
    ctx.shadowBlur = 0;
    ctx.strokeStyle = a.hit ? '#ffd24a' : col; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.tip.tx, a.tip.ty); ctx.stroke();
    ctx.shadowColor = a.hit ? '#ffd24a' : col; ctx.shadowBlur = a.hit ? 22 : 12;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = a.human ? '#fff' : 'rgba(255,255,255,.35)'; ctx.lineWidth = a.human ? 3 : 1.5; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.font = '17px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(a.human ? '⭐' : RM[a.role].e, a.x, a.y - a.r - 6);
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    ctx.fillStyle = `hsla(${p.hue},100%,60%,${p.life})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * p.life + 0.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  // HUD
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const fs = Math.max(13, cv.width / 46);
  ctx.fillStyle = '#e8edf2'; ctx.font = `bold ${fs * 1.2}px system-ui, sans-serif`; ctx.textAlign = 'left';
  ctx.fillText(`味方 ${score.me} - ${score.foe} 敵`, 14, fs * 2);
  ctx.font = `${fs}px system-ui, sans-serif`;
  ctx.fillStyle = '#7fe3cf'; ctx.fillText(lineup[0], 14, cv.height - fs * 2.4);
  ctx.fillStyle = '#ff8a96'; ctx.fillText(lineup[1], 14, cv.height - fs * 0.9);
  if (flash > 0) {
    ctx.textAlign = 'center'; ctx.fillStyle = '#e0b341';
    ctx.font = `bold ${Math.max(28, cv.width / 16) * (1 + flash / 70 * 0.8)}px system-ui, sans-serif`;
    ctx.shadowColor = `hsl(${goalHue},100%,60%)`; ctx.shadowBlur = 30;
    ctx.fillText(flashText, cv.width / 2, cv.height / 2);
  }
}

let last = performance.now(), acc = 0;
function loop(t) {
  acc = Math.min(acc + (t - last) / 1000, 0.1); last = t;
  while (acc >= 1 / 60) { step(); acc -= 1 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
