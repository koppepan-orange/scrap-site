<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101820">
    <title>LAST LIGHT - Solo Arena</title>
    <link rel="stylesheet" href="mitame.css">
</head>
<body>
    <div id="logOutput" class="draggable">
        <div class="logs"></div>
        <div class="row">
            <textarea></textarea>
            <div class="bt">➡︎</div>
        </div>
    </div>
    <div id="mobileDesc"></div>
    <div id="log" class="hid">
        <div class="opener">&lt;</div>
        <div class="main"></div>
        <div class="text"></div>
    </div>
    <div id="tenshee">
        <div class="disp"></div>
        <div class="bts">
            <div class="bt num" data-num="1">1</div><div class="bt num" data-num="2">2</div><div class="bt num" data-num="3">3</div>
            <div class="bt num" data-num="4">4</div><div class="bt num" data-num="5">5</div><div class="bt num" data-num="6">6</div>
            <div class="bt num" data-num="7">7</div><div class="bt num" data-num="8">8</div><div class="bt num" data-num="9">9</div>
            <div class="bt del">←</div><div class="bt num" data-num="0">0</div><div class="bt ok">OK</div>
        </div>
    </div>
    <div id="movlis">
        <div class="title">Move List</div>
        <div class="list"></div>
    </div>

    <div id="main">
        <div id="home" class="space"></div>
    </div>

    <script src="data.js"></script>
    <script src="komagome.js"></script>
    <script src="nakami.js"></script>
    <script src="game.js"></script>
</body>
</html>
