<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="" href="mitame.css">
    <title>スターターパック</title>
</head>
<body>
    <div id="mobileDesc"></div>
    <div id="log" class="hid">
        <div class="opener"><</div>
        <div class="main"></div>
    </div>
    <div id="tenshee">
        <div class="disp"></div>
        <div class="bts">
            <div class="bt num" data-num="1">1</div>  <div class="bt num" data-num="2">2</div> <div class="bt num" data-num="3">3</div>
            <div class="bt num" data-num="4">4</div>  <div class="bt num" data-num="5">5</div> <div class="bt num" data-num="6">6</div>
            <div class="bt num" data-num="7">7</div>  <div class="bt num" data-num="8">8</div> <div class="bt num" data-num="9">9</div>
            <div class="bt del">←</div> <div class="bt num" data-num="0">0</div> <div class="bt ok">OK</div>
        </div>
    </div>
    <div id="movlis">
        <div class="title">Move List</div>
        <div class="list"></div>
    </div>
    

    <div id="main">
        <div class="bt"

        <!-- https://brawlinsights.com/ja/tools/starrdrop_chances -->
        <div id="demand">

        </div>
        <div id="station">
            <!-- <div class="gas simple"></div> -->
        </div>
    </div>


    <script>
        const Gaces = [
            {
                name:"normal",
                jpnm:"スタードロップ",
                chance:4,
                sin:"緑",
                cos:1,
                cack:{
                    p:[50, 28, 15, 5, 2],
                    m:["緑", "青", "紫", "赤", "金"]
                }
            },
        ]

        const demanD = document.getElementById("demand");
        const statiD = document.getElementById("station");

        let now = 0;
        let cha = 0;

        function nosel(gac){
            let div = El("div", `gac ${gac.name}`);
            statiD.appendChild(div);

             now = gac.name;
            cha = gac.chance;
            
        }

        document.addEventListener("DOMContentLoaded", () => {
            // start処理
            for(let gac of Gaces){
                let label = El("div", "label");
                 label.textContent = gac.jpnm;
                let div = El("div", `gac ${gac.name}`, [label]);

                div.addEventListener("click", () => nosel(gac));
                
                demanD.appendChild(div);
            }
        })
    </script>
    <script src="stroll_game/komagome.js" defer></script>
</body>
</html>
