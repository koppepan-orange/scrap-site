 <!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mitame.css">
    <title>Agree! Carboner!!</title>
</head>
<body>
    <div id="mobileDesc"></div>
    <div id="log" class="hid">
        <div class="opener"><</div>
        <div class="main"></div>
        <div class="text"></div>
    </div>
    <div id="tenshee">
        <div class="disp"></div>
        <div class="bts">
            <div class="bt num" data-num="1">1</div>  <div class="bt num" data-num="2">2</div> <div class="bt num" data-num="3">3</div>
            <div class="bt num" data-num="4">4</div>  <div class="bt num" data-num="5">5</div> <div class="bt num" data-num="6">6</div>
            <div class="bt num" data-num="7">7</div>  <div class="bt num" data-num="8">8</div> <div class="bt num" data-num="9">9</div>
            <div class="bt del">←</div> <div class="bt num" data-num="0">0</div> <div class="bt ok">OK</div>
        </div>
    </div>
    <div id="movlis">
        <div class="title">Move List</div>
        <div class="list"></div>
    </div>
    

    <div id="main">
        <!-- アージャ・アステリオン -->

        <div id="rimi">
            <div>Rimi:</div>
            <div class="num">0</div>
        </div>

        <div id="cup">
            <img src="assets/images/systems/cup.png"/>
        </div>

        <div id="phone">
            <span class="gz-waku"></span>

            <div class="apps"></div>

            <div class="app map">
                <div class="liver">
                    <!-- 肝臓(ミニマップ) -->
                </div>
            </div>

            <div class="app amon">
                <!-- ポイ活アプリ -->
            </div>

            <div class="app uwub">
                <div class="area dealer">
                    <div class="column">
                        <div class="name">Dealer</div>
                        <div class="hp"></div>
                    </div>
                    <div class="num">0</div>
                    <div class="place"></div>
                </div>
                <div class="area player">
                    <div class="column">
                        <div class="name">Player</div>
                        <div class="hp"></div>
                    </div>
                    <div class="num">0</div>
                    <div class="place"></div>
                </div>
                <div class="bts"></div>
            </div>
        </div>
        
        <div id="home" class="space">
            <!-- 自室 -->
            <div class="unit uni1">
                <!-- 家近辺 -->
                <div class="bt farm">畑の様子を見に行く</div>
                <div class="bt cook">キッチンに向かう</div> <!--確率で"キッキンチキンに向かう"に-->
            </div>
            
            <div class="unit uni2">
                <!-- 出かける -->
                <div class="bt stroll">ちょっくら歩く</div>
                <div class="bt shop">売店に行く</div>
                <div class="bt door">あのドアを探す</div>
            </div>
        </div>

        <div id="farm" class="space">
            <div class="return" data-belong="farm"></div>
            <!-- 畑 -->

        </div>

        <div id="cook" class="space">
            <div class="return" data-belong="cook"></div>
            <!-- やあ！僕はキッキンチキン！ -->

        </div>


        <div id="road" class="space">
            <div class="log"></div>

            <div class="bts">
                <div class="row upper">
                    <div class="bt u">へ</div>
                </div>
                <div class="row under">
                    <div class="bt l">く</div>
                    <div class="bt r">＞</div>
                </div>
            </div>
        </div>
        
        <div id="shop" class="space">
            <div class="return" data-belong="shop"></div>
            <!-- 売店 -->
        </div>

        <div id="door" class="space">
            <div class="return" data-belong="door"></div>
            <!-- 謎のドア。これを通って階段を降りると謎カジノへ -->

            <div class="area loby">
                <!--ろびーです-->
                <div class="paints"></div>
            </div>

            <div class="area cryo">
                <!--Scuro e Nero Soldatoの縮小版です-->

            </div>

            <div class="area cave">
                <!--競馬です 馬じゃないけど-->

                <div class="bts">
                    <div class="bt start">staRt</div>
                </div>

                <div class="racers"></div>
            </div>

            <div class="area jump">
                <div class="gaku">
                    <div class="label">合計</div>
                    <div class="aima">:</div>
                    <div class="num">0</div>
                </div>

                <div class="output"></div>
                
                <div class="bts">
                    <div class="bt vai">費用: Ɍ0</div>
                    <div class="bt start">Start</div>
                </div>
            </div>


            <div class="area forage">
                <div class="gamen started">
                    <!-- 画面(液晶) -->

                    <div class="dimee started">
                        <img class="logo" src="assets/images/forages/foragener_logo.png" alt="DQ0">
                    </div>

                    <div class="dimee hondie">
                        <img src="assets/images/forages/foragener_back.png" alt="back">

                        <div class="mushes"></div>
                    </div>

                    <div class="dai">
                        <!-- 台 -->
                        <div class="irel">
                            <img src="assets/images/forages/100yen.png"/>
                            <div class="auto">Auto</div>
                        </div>

                        <div class="otsu">
                            <img src="assets/images/forages/lever.png"/>
                        </div>

                        <div class="disp"></div>

                        <div class="bottan"></div>

                        <div class="getout">
                            <img src="assets/images/forages/getout.png"/>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    

    <script>
        (async() => {
            let ts = new Date().getTime(); 

            let ZettaiTukawarenaiKannsuu = async (f) => {
                return new Promise(res => {
                    let script = document.createElement('script');
                    script.src = `${f}.js?v=${ts}`;
                    script.defer = true;
                    script.onload = res;
                    document.head.appendChild(script);
                });        
            }
            await ZettaiTukawarenaiKannsuu("data");
            await ZettaiTukawarenaiKannsuu("komagome");
            await ZettaiTukawarenaiKannsuu("nakami");
        })();
    </script>
</body>
</html>
