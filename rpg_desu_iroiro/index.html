<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mitame.css">
    <title>スターターパック</title>
</head>
<body>
    <div id="mobileDesc"></div>
    <div id="log" class="hid">
        <div class="opener"><</div>
        <div class="main"></div>
        <div class="text"></div>
    </div>
    <div id="tenshee">
        <div class="disp"></div>
        <div class="bts">
            <div class="bt num" data-num="1">1</div>  <div class="bt num" data-num="2">2</div> <div class="bt num" data-num="3">3</div>
            <div class="bt num" data-num="4">4</div>  <div class="bt num" data-num="5">5</div> <div class="bt num" data-num="6">6</div>
            <div class="bt num" data-num="7">7</div>  <div class="bt num" data-num="8">8</div> <div class="bt num" data-num="9">9</div>
            <div class="bt del">←</div> <div class="bt num" data-num="0">0</div> <div class="bt ok">OK</div>
        </div>
    </div>
    <div id="movlis">
        <div class="title">Move List</div>
        <div class="list"></div>
    </div>
    

    <div id="main">
        <style id="ButtonStyle"></style>
        <div class="space" id="main">
            <div id="BattleScene">
                <div class="turn">
                    <div>Turn:</div>
                    <div class="num">0</div>
                </div>
                <span>turn:</span><span id="TurnCount">0</span>
                <br><b id="EnemyName">enemy</b>   <i>Lv.</i><i id="EnemyLevel">1</i>   <u id="EnemyDebuff"></u>   <u id="EnemySkillDebuff"></u>
                <br><span id="EnemyHealth">0</span>/<span id="EnemyMaxHealth">0</span>
                <span id="PlayerFriendFront"></span>
                <br><br><b id="PlayerName">player</b>   <i>Lv.</i><i id="PlayerLevel">1</i>   <u id="PlayerBuff"></u>   <u id="PlayerSkillBuff"></u><span id="AdditionalPlayerPoint"></span>
                <br><span id="PlayerHealth">0</span>/<span id="PlayerMaxHealth">0</span>
                <span id="PlayerFriendBack"></span>
                <br><br><br>
                <button class="button" id="select1" onclick="select1()">attack</button>  
                <button class="button" id="select2" onclick="select2()">magic</button>
                <button class="button" id="select3" onclick="select3()">tools</button>
                <button class="button" id="back" onclick="back()">pass</button>
                <br><span id="Skillbutton"> </span>
                <br><br><span align="center" id="log">pless "reset" to game start</span>
                <br><span id="StatusAppearDisappear"><button class="button" id="StatusButton" onclick="StatusAppear()">status</button></span>
                <br><span id="Status"> </span>
                <br><br><br><br><span id="BackButtonDesu"></span> 
            </div>
            <span id="Thisdisappearsafterthegamestartnameinput"><br><input class="button" id="NameInputText" type="text" maxlength="10" placeholder="write name here"></span>
            <br><span id="Thisdisappearsafterthegamestartbegin"><button align="center" class="button" onclick="begin()">start!</button></span>
    </div>
    
    <!-- <script src="data.js" defer></script> -->
    <!-- <script src="nakami.js" defer></script> -->

    <script>
        (async() => {
            let ts = new Date().getTime(); 

            let ZettaiTukawarenaiKannsuu = async (f) => {
                return new Promise(res => {
                    let script = document.createElement('script');
                    script.src = `${f}.js?v=${ts}`;
                    script.defer = true;
                    script.onload = res;
                    document.head.appendChild(script);
                });        
            }
            await ZettaiTukawarenaiKannsuu(`data`);
            await ZettaiTukawarenaiKannsuu(`nakami`);
        })();
    </script>
</body>
</html>
