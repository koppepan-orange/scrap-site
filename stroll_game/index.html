<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drink Shop</title>
    <link rel="stylesheet" href="mitame.css">
    <style>
    </style>
</head>
<body>
    <div id="mobileDesc"></div>
    <div id="log" class="hid">
        <div class="opener"><</div>
        <div class="main"></div>
    </div>
    <div id="tenshee">
        <div class="disp"></div>
        <div class="bts">
            <div class="bt num" data-num="1">1</div>  <div class="bt num" data-num="2">2</div> <div class="bt num" data-num="3">3</div>
            <div class="bt num" data-num="4">4</div>  <div class="bt num" data-num="5">5</div> <div class="bt num" data-num="6">6</div>
            <div class="bt num" data-num="7">7</div>  <div class="bt num" data-num="8">8</div> <div class="bt num" data-num="9">9</div>
            <div class="bt del">←</div> <div class="bt num" data-num="0">0</div> <div class="bt ok">OK</div>
        </div>
    </div>
    <div id="movlis">
        <div class="title">Move List</div>
        <div class="list"></div>
    </div>


    <div id="UI" style="border: dashed rgb(73, 73, 73);">
        <div id="UI1"></div>
        <div id="UI2"></div>
        <div id="UI3"></div>
    </div>
    
    <div id="time">06:00</div>
    
    <div id="scene">
        <button class="button" onclick="LetsStroll()">Go to stroll</button><br><br>
        <button class="button" onclick="GoShop()">Shop</button>
    </div>

    <div id="main">
        <div id="rimi">
            <div>Rimi:</div>
            <div class="num">0</div>
        </div>

        <div id="cup">
            <img src="assets/images/systems/cup.png"/>
        </div>

        <div id="phone">
            
        </div>

        <div id="home" class="space">
            <div class="unit">
                <div class="bt go">散歩に行こう</div>
                <div class="bt shop">買物に行こう</div>
            </div>
        </div>

        <div id="road" class="space">
            <div class="liver">
                <!-- 肝臓(ミニマップ) -->
            </div>

            <div class="bts">
                <div class="row upper">
                    <div class="bt u">へ</div>
                </div>
                <div class="row under">
                    <div class="bt l">く</div>
                    <div class="bt r">＞</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        (async() => {
            let ts = new Date().getTime(); 

            let ZettaiTukawarenaiKannsuu = async (f) => {
                return new Promise(res => {
                    let script = document.createElement('script');
                    script.src = `${f}.js?v=${ts}`;
                    script.defer = true;
                    script.onload = res;
                    document.head.appendChild(script);
                });        
            }
            await ZettaiTukawarenaiKannsuu(`data`);
            await ZettaiTukawarenaiKannsuu(`komagome`);
            await ZettaiTukawarenaiKannsuu(`nakami`);
        })();
    </script>
</body>
</html>
