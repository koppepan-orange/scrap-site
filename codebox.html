<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Simple Code Pad</title>
<style>
    @font-face {
        font-family: "hackgen";
        src: url("fonts/assets/hackgen.ttf");
    }
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        background: #dedede;
        font-family: hackgen;
        font-size: 16px;
        line-height: 1.6;
    }
    #container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
    #highlight, #editor {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        margin: 0;
        padding: 32px;
        border: none;
        outline: none;
        resize: none;
        font-family: hackgen;
        font-size: 16px;
        line-height: 1.6;
        tab-size: 4;
        white-space: pre;
        overflow: auto;
        overflow-wrap: normal;
    }
    #highlight {
        pointer-events: none;
        color: #2b2b2b;
        background: transparent;
    }
    #editor {
        background: transparent;
        color: transparent;
        caret-color: #2b2b2b;
        -webkit-text-fill-color: transparent;
        z-index: 2;
    }
    #editor::selection {
        background: #def0ff;
        -webkit-text-fill-color: transparent;
    }
    .highlighted {
        white-space: pre;
    }
    .bracket-match {
        background: #b8dfff;
        outline: 1px solid #579bd3;
        border-radius: 2px;
    }
</style>
</head>
<body>
<div id="container">
    <pre id="highlight"></pre>
    <textarea id="editor" spellcheck="false" placeholder="Write code here..."></textarea>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const editor = document.getElementById("editor");
    const highlight = document.getElementById("highlight");
    // 色設定
    const colors = {
        "function": "#ff80ff",
        "let": "#8080ff",
        "const": "#8080ff",
        "var": "#8080ff",
        "return": "#ffcc80",
        "if": "#80ffff",
        "else": "#80ffff",
        "for": "#80ffff",
        "while": "#80ffff",
        "class": "#ff80ff",
        "new": "#ffcc80"
    };
    // 括弧設定
    const brackets = {
        "(": ")",
        "{": "}",
        "[": "]",
        "<": ">"
    };
    // 保存データ読み込み
    editor.value = localStorage.getItem("simpleCodePad") || "";
    // HTMLエスケープ
    const escapeHTML = (str) => {
        return str.replace(/[&<>"']/g, (c) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[c]);
    };
    // 対応する括弧を検索
    const findMatchingBracket = (text, position) => {
        const char = text[position];
        if (!char) return null;
        const opening = Object.keys(brackets);
        const closing = Object.values(brackets);
        // 開き括弧の場合
        if (opening.includes(char)) {
            const target = brackets[char];
            let depth = 0;
            for (let i = position; i < text.length; i++) {
                if (text[i] === char) depth++;
                if (text[i] === target) {
                    depth--;
                    if (depth === 0) {
                        return i;
                    }
                }
            }
        }
        // 閉じ括弧の場合
        else if (closing.includes(char)) {
            const target = opening[closing.indexOf(char)];
            let depth = 0;
            for (let i = position; i >= 0; i--) {
                if (text[i] === char) depth++;
                if (text[i] === target) {
                    depth--;
                    if (depth === 0) {
                        return i;
                    }
                }
            }
        }
        return null;
    };
    // カーソル周辺の括弧を取得
    const getActiveBrackets = () => {
        const text = editor.value;
        const pos = editor.selectionStart;
        const candidates = [
            pos - 1,
            pos
        ];
        for (const index of candidates) {
            if (index < 0 || index >= text.length) continue;
            const char = text[index];
            if (
                !Object.keys(brackets).includes(char) &&
                !Object.values(brackets).includes(char)
            ) continue;
            const match = findMatchingBracket(text, index);
            if (match !== null) {
                return [index, match];
            }
        }
        return [];
    };
    // ハイライト処理
    const updateHighlight = () => {
        const text = editor.value;
        const activeBrackets = getActiveBrackets();
        const keys = Object.keys(colors)
            .sort((a, b) => b.length - a.length)
            .map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
            .join("|");
        const regex = new RegExp(
            `(^|[ \\t])(${keys})(?=$|[ \\t])`,
            "g"
        );
        const colored = new Map();
        let match;
        while ((match = regex.exec(text)) !== null) {
            const prefix = match[1];
            const word = match[2];
            const start = match.index + prefix.length;
            for (let i = 0; i < word.length; i++) {
                colored.set(start + i, colors[word]);
            }
        }
        let result = "";
        for (let i = 0; i < text.length; i++) {
            const char = escapeHTML(text[i]);
            const color = colored.get(i);
            const isBracket = activeBrackets.includes(i);
            if (isBracket) {
                result += `<span class="bracket-match">${char}</span>`;
            } else if (color) {
                result += `<span style="color:${color}">${char}</span>`;
            } else {
                result += char;
            }
        }
        highlight.innerHTML = result + "\n";
        syncScroll();
    };
    // スクロール同期
    const syncScroll = () => {
        highlight.scrollTop = editor.scrollTop;
        highlight.scrollLeft = editor.scrollLeft;
    };
    // 入力処理
    editor.addEventListener("input", () => {
        localStorage.setItem("simpleCodePad", editor.value);
        updateHighlight();
    });
    // カーソル移動時の更新
    editor.addEventListener("click", updateHighlight);
    editor.addEventListener("keyup", updateHighlight);
    editor.addEventListener("select", updateHighlight);
    editor.addEventListener("scroll", syncScroll);
    // キー入力処理
    editor.addEventListener("keydown", (e) => {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const text = editor.value;
        // Tab
        if (
            e.key === "Tab" &&
            !e.shiftKey &&
            !e.altKey &&
            !e.ctrlKey &&
            !e.metaKey
        ) {
            e.preventDefault();
            editor.setRangeText("\t", start, end, "end");
            editor.dispatchEvent(new Event("input"));
            return;
        }
        // Enter
        if (e.key === "Enter") {
            e.preventDefault();
            // 現在の行頭を取得
            const lineStart = text.lastIndexOf("\n", start - 1) + 1;
            // 行頭からカーソルまで
            const currentLine = text.slice(lineStart, start);
            // 行頭のインデントを取得
            const indent = currentLine.match(/^\t*/)[0];
            // カーソル直前・直後
            const before = text.slice(0, start);
            const after = text.slice(end);
            const beforeTrimmed = before.trimEnd();
            const afterTrimmed = after.trimStart();
            const opening = /[\{\[\(]$/;
            const closing = /^[\}\]\)]/;
            let nextIndent = indent;
            // 開き括弧と閉じ括弧の間
            const lastChar = beforeTrimmed.slice(-1);
            const firstChar = afterTrimmed[0];
            const isPair =
                brackets[lastChar] === firstChar;
            if (isPair) {
                // 内側と外側の2行を作る
                const innerIndent = indent + "\t";
                const insertion =
                    "\n" + innerIndent +
                    "\n" + indent;
                editor.setRangeText(
                    insertion,
                    start,
                    end,
                    "preserve"
                );
                // カーソルを内側の行へ
                const cursor = start + 1 + innerIndent.length;
                editor.setSelectionRange(cursor, cursor);
                editor.dispatchEvent(new Event("input"));
                return;
            }
            // 開き括弧の直後なら1階層深く
            if (opening.test(beforeTrimmed)) {
                nextIndent = indent + "\t";
            }
            // 閉じ括弧の直前なら1階層浅く
            else if (closing.test(afterTrimmed)) {
                nextIndent = indent.slice(0, -1);
            }
            // 改行
            const insertion = "\n" + nextIndent;
            editor.setRangeText(
                insertion,
                start,
                end,
                "end"
            );
            editor.dispatchEvent(new Event("input"));
        }
    });
    // 初期表示
    updateHighlight();
});
</script>
</body>
</html>
