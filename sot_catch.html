<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Catch Destroy Rhythm</title>
    <style>
    body{
        margin:0;
        height:100vh;
        background:#111;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        font-family:sans-serif;
    }

    #game{
        text-align:center;
    }

    #action{
        font-size:50px;
        margin:30px;
    }

    #judge{
        font-size:35px;
        height:50px;
    }

    #info{
        font-size:20px;
        color:#aaa;
    }

    button{
        padding:15px 30px;
        font-size:20px;
    }
    </style>
</head>

<body>

    <div id="game">

    <h1>Catch / Destroy</h1>

    <button id="start">
    START
    </button>

    <div id="action">
    READY
    </div>

    <div id="judge">
    </div>

    <div id="info">
    Z : キャッチ　　X : 破壊！！
    </div>

    </div>


    <script>
        class RhythmGame{

        constructor(bpm=120){

            this.beatLength = 60/bpm;
            this.tripletLength = this.beatLength*2/3;

            this.audioCtx=null;

            this.targetTime=0;
            this.pattern=null;

            this.active=false;
            this.result=false;


            window.addEventListener("keydown",(e)=>{

                if(!this.active)return;


                if(e.code==="KeyZ"){
                    this.input("catch");
                }

                if(e.code==="KeyX"){
                    this.input("destroy");
                }

            });


        }



        initAudio(){

            if(!this.audioCtx){

                this.audioCtx=
                new(window.AudioContext||
                window.webkitAudioContext)();

            }

        }



        beep(freq,time,duration){

        const osc=this.audioCtx.createOscillator();
        const gain=this.audioCtx.createGain();


        osc.frequency.setValueAtTime(freq,time);


        osc.connect(gain);
        gain.connect(this.audioCtx.destination);



        gain.gain.setValueAtTime(0,time);
        gain.gain.linearRampToValueAtTime(
            0.3,
            time+0.01
        );

        gain.gain.linearRampToValueAtTime(
            0,
            time+duration
        );


        osc.start(time);
        osc.stop(time+duration);

        }




        play(pattern){

            this.initAudio();

            this.active=true;
            this.result=false;

            this.pattern=pattern;


            const start =
                this.audioCtx.currentTime + 0.2;



            if(pattern==="catch"){

                action.textContent="キャッチ！！ Z";


                // ラ ミ 高ラ
                this.beep(
                    440,
                    start,
                    0.1
                );

                this.beep(
                    659.25,
                    start + this.tripletLength,
                    0.1
                );

                this.beep(
                    880,
                    start + this.tripletLength*2,
                    0.1
                );


                // 2拍後
                this.targetTime =
                    start + this.beatLength*2;

            }



            if(pattern==="destroy"){

                action.textContent="破壊！！ X";


                // レ♭
                this.beep(
                    277.18,
                    start,
                    this.beatLength-0.05
                );


                let tripletStart =
                    start + this.beatLength;



                // ラ
                this.beep(
                    440,
                    tripletStart,
                    0.1
                );


                // ファ#
                this.beep(
                    369.99,
                    tripletStart + this.tripletLength,
                    0.1
                );


                // ド
                this.beep(
                    523.25,
                    tripletStart + this.tripletLength*2,
                    0.1
                );



                // レ♭開始から3拍後
                this.targetTime =
                    start + this.beatLength*3;

            }



            // 判定時間
            setTimeout(()=>{

                if(this.active&&!this.result){

                    this.active=false;
                    judge.textContent="MISS";

                    setTimeout(()=>{
                        this.next();
                    },500);

                }

            },
            500);

        }




        input(type){



        if(this.result)return;



        // 押したキーが違う

        if(type!==this.pattern){

            judge.textContent="違うキー！";

            this.result=true;

            this.active=false;


            setTimeout(()=>{
                this.next();
            },1000);


            return;

        }



        let now=
        this.audioCtx.currentTime;


        let diff=
        (now-this.targetTime);



        let ms=
        Math.abs(diff*1000);



        if(ms<50){

            judge.textContent="PERFECT！！";

        }

        else if(ms<120){

            judge.textContent="GOOD";

        }

        else{

            judge.textContent="MISS";

        }



        this.result=true;
        this.active=false;



        setTimeout(()=>{

            this.next();

        },1000);



        }




        next(){

            judge.textContent="";

            setTimeout(()=>{

                let p =
                Math.random()<0.5
                ?"catch"
                :"destroy";


                this.play(p);


            },
            this.beatLength*1000);

        }


        }




        const game=
        new RhythmGame(120);



        start.onclick=()=>{

        start.style.display="none";

        game.next();

        };
    </script>

</body>
</html>
