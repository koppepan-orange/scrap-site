<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mitame.css">
    <title>DQ0 -ﾄﾞｷｭﾝ!ﾎﾞｸﾉﾊｰﾄﾊﾓｳｾﾞﾛｻ!-</title>
</head>
<body>
    <div id="mobileDesc"></div>
    <div id="log" class="hid">
        <div class="opener"><</div>
        <div class="main"></div>
        <div class="text"></div>
    </div>
    <div id="tenshee">
        <div class="disp"></div>
        <div class="bts">
            <div class="bt num" data-num="1">1</div>  <div class="bt num" data-num="2">2</div> <div class="bt num" data-num="3">3</div>
            <div class="bt num" data-num="4">4</div>  <div class="bt num" data-num="5">5</div> <div class="bt num" data-num="6">6</div>
            <div class="bt num" data-num="7">7</div>  <div class="bt num" data-num="8">8</div> <div class="bt num" data-num="9">9</div>
            <div class="bt del">←</div> <div class="bt num" data-num="0">0</div> <div class="bt ok">OK</div>
        </div>
    </div>
    <div id="movlis">
        <div class="title">Move List</div>
        <div class="list"></div>
    </div>
    

    <div id="main">
        
        <div id="rimi">
            <div>Rimi:</div>
            <div class="num">0</div>
        </div>

        <div id="cup">
            <img src="assets/images/items/dirtycup.png"/>
        </div>

        <div class="space" id="home">
            <div class="uni unit1">
                <div class="botan venture">大地を踏み締める</div>
            </div>

            <div class="uni unit2">
                <div class="botan gamble">娯楽島ラッカラン</div>
                <!-- <div class="botan gamble">グロッタの街</div> -->
            </div>

            <div class="uni unit3">
                <div class="botan quit">切断する</div>
                <div class="botan atukie">取扱説明書</div>
            </div>
        </div>

        <div class="space" id="batt">
            <div class="upui">
                <!-- upper ui -->
                <div class="co turn">
                    <div>Turn:</div>
                    <div class="num">0</div>
                </div>

                <div class="co killen">
                    <div>Killed:</div>
                    <div class="num">0</div>
                </div>
            </div>

            <div class="humans enemies"></div>

            <div class="humans players"></div>

            <div class="bts">
                <div class="bt bt0"></div>
                <div class="bt bt1"></div>
                <div class="bt bt2"></div>
                <div class="bt bt3"></div>
            </div>
        </div>

        <div class="space" id="gamble">
            <div class="heya loby show">
                <div class="return"></div>
                ここはロビーです。
                <div class="bashos"></div>
            </div>

            <div class="heya blacky">
                <div class="return"></div>

                <div class="upui">
                    <div class="doo bj">
                        <div>BJ:</div>
                        <div class="num"></div>
                    </div>
                    <div class="doo diff">
                        <div>Else:</div>
                        <div class="num"></div>
                    </div>
                </div>

                <div class="zone preing">
                    <div class="main">
                        <div class="mono shorts"></div>

                        <div class="mono range"></div>
                    </div>

                    <div class="bet">
                        <div>Bet:</div>
                        <div class="num"></div>
                    </div>
                </div>

                <div class="zone toing">
                    <div class="human dealer">
                        <div class="gok">
                            <div>Total:</div>
                            <div class="num"></div>
                        </div>
                        <div class="place"></div>
                    </div>

                    <div class="human player">
                        <div class="gok">
                            <div>Total:</div>
                            <div class="num"></div>
                        </div>
                        <div class="place"></div>
                    </div>

                    <div class="bts">
                        <div class="bt double">DOUBLE</div>
                        <div class="bt stand">STAND</div>
                        <div class="bt hit">HIT</div>
                    </div>
                </div>

                <div class="commons">
                    <div class="comman start">おお、やるか？</div>
                    <div class="comman back">こんにちは。</div>
                </div>
            </div>
            
            <div class="heya rourou">
                <div class="return"></div>

                何もないよ（笑）
            </div>

            <div class="heya forage">
                <div class="return"></div>

                <div class="gamen started">
                    <!-- 画面(液晶) -->

                    <div class="dimee started">
                        <img class="logo" src="assets/images/systems/foragener_logo.png" alt="DQ0">
                    </div>

                    <div class="dimee hondie">
                        <img src="assets/images/systems/foragener_back.png" alt="back">

                        <div class="mushes"></div>
                    </div>

                    <div class="dai">
                        <!-- 台 -->
                        <div class="irel">
                            <img src="assets/images/systems/100yen.png"/>
                            <div class="auto">Auto</div>
                        </div>

                        <div class="otsu">
                            <img src="assets/images/systems/lever.png"/>
                        </div>

                        <div class="disp"></div>

                        <div class="bottan"></div>

                        <div class="getout">
                            <img src="assets/images/systems/getout.png"/>
                        </div>
                    </div>
                </div>


        </div>

    </div>
    
    <!-- <script src="data.js" defer></script> -->
    <!-- <script src="nakami.js" defer></script> -->

    <script>
        (async() => {
            let ts = new Date().getTime(); 

            let ZettaiTukawarenaiKannsuu = async (f) => {
                return new Promise(res => {
                    let script = document.createElement('script');
                    script.src = `${f}.js?v=${ts}`;
                    script.defer = true;
                    script.onload = res;
                    document.head.appendChild(script);
                });        
            }
            await ZettaiTukawarenaiKannsuu(`data`);
            await ZettaiTukawarenaiKannsuu(`nakami`);
        })();
    </script>
</body>
</html>
